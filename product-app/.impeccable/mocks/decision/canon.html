<!doctype html><html lang="es"><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0}
body{width:1440px;height:900px;overflow:hidden;font-family:system-ui,sans-serif;background:#F8FAFC;color:#0F172A;display:grid;grid-template-columns:240px 1fr}
aside{background:#fff;border-right:1px solid #E2E8F0;padding:24px 16px}
aside b{font-size:18px}
aside a{display:block;padding:10px 12px;margin-top:6px;border-radius:8px;color:#475569;font-size:14px}
aside a.on{background:#EFF6FF;color:#2563EB;font-weight:600}
main{padding:32px 40px}
.row{display:flex;justify-content:space-between;align-items:center}
h1{font-size:28px;font-weight:700}
.btn{background:#2563EB;color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;font-weight:600}
.card{margin-top:24px;background:#fff;border:1px solid #E2E8F0;border-radius:12px}
.ch{padding:16px 20px;border-bottom:1px solid #E2E8F0}
.search{border:1px solid #CBD5E1;border-radius:8px;padding:9px 12px;width:300px;color:#94A3B8;font-size:14px}
table{width:100%;border-collapse:collapse}
td,th{padding:16px 20px;text-align:left;border-bottom:1px solid #F1F5F9;font-size:14px}
th{font-size:12px;color:#64748B;font-weight:600}
</style></head><body>
<aside><b>ProductHub</b><a>Inicio</a><a class="on">Productos</a><a>Nuevo producto</a></aside>
<main><div class="row"><h1>Productos</h1><span class="btn">+ Nuevo producto</span></div>
<div class="card"><div class="ch"><span class="search">Buscar productos…</span></div>
<table><tr><th>Nombre</th><th>Resource ID</th></tr>
<tr><td>Wireless Headphones</td><td>product-001</td></tr><tr><td>Smart Watch</td><td>product-002</td></tr>
<tr><td>Mechanical Keyboard</td><td>product-003</td></tr><tr><td>4K Monitor</td><td>product-004</td></tr></table></div></main>
</body></html>
