<!doctype html><html lang="es"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Work+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:1440px;height:900px;overflow:hidden;background:#F4F4EF;color:#0D0D0D;font-family:"Work Sans",sans-serif;display:grid;grid-template-columns:220px 1fr}
aside{background:#0D0D0D;color:#F4F4EF;padding:28px 20px;font-family:Silkscreen}
aside b{font-size:22px;color:#FF3B1F}
aside p{margin-top:28px;font-size:14px;padding:10px 0;border-bottom:1px dotted #555}
main{padding:36px 48px}
h1{font-family:Silkscreen;font-weight:700;font-size:120px;line-height:.9;letter-spacing:-.02em}
h1 span{color:#FF3B1F}
.bar{display:flex;justify-content:space-between;margin-top:24px;align-items:center}
.search{border:2px solid #0D0D0D;padding:12px 16px;width:420px;font-size:14px;color:#777}
.btn{background:#FF3B1F;color:#fff;font-family:Silkscreen;padding:14px 20px}
.cols{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:32px;border-top:3px solid #0D0D0D}
.c{padding:20px;border-right:1px solid #BDBDB5}
.c .n{font-family:Silkscreen;font-size:56px}
.c h3{font-family:Silkscreen;font-size:20px;margin-top:10px}
.c h4{font-family:Silkscreen;font-size:12px;margin-top:6px;color:#666}
.c p{font-size:13px;margin-top:16px}
</style></head><body>
<aside><b>PRODUCTHUB</b><p>&gt; Inicio</p><p>&gt; Productos</p><p>&gt; Nuevo</p></aside>
<main><h1>PRODUC<span>TOS</span></h1>
<div class="bar"><span class="search">Buscar en el catálogo</span><span class="btn">+ NUEVO</span></div>
<div class="cols">
<div class="c"><div class="n">01</div><h3>Wireless Headphones</h3><h4>Wireless Headphones</h4><p>product-001</p></div>
<div class="c"><div class="n">02</div><h3>Smart Watch</h3><h4>Smart Watch</h4><p>product-002</p></div>
<div class="c"><div class="n">03</div><h3>Mechanical Keyboard</h3><h4>Mechanical Keyboard</h4><p>product-003</p></div>
<div class="c"><div class="n">04</div><h3>4K Monitor</h3><h4>4K Monitor</h4><p>product-004</p></div>
</div></main></body></html>
